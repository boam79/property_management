# Lint + unit tests for the web app (production build/deploy is handled by Vercel).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Pure-logic smoke checks
        run: |
          npm run test:qr-token
          npm run test:assets-pagination
          npm run test:assets-export
          npm run test:register-errors
          npm run check:no-stub
          npm run check:redirect
